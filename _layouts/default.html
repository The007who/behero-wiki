<!DOCTYPE html>
<html lang="ita">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="keywords" content="behero, be hero, combatti, giochipreziosi, gioco, giochi, digitalpreziosi">

    <meta property="og:image" content="{{ '/resources/layout/logo.png' | prepend: site.url }}">
    <meta name="twitter:title" content="{{ page.title }}">
    <meta name="twitter:description" content="{{ site.seo.description }}">
    <meta name="twitter:image" content="{{ '/resources/layout/logo.png' | prepend: site.url }}">
    {%- seo title=false -%}
    <title>{{ page.title }} » BeHero Wiki</title>

    <link rel="stylesheet" href="{{ 'css/default.css' | relative_url }}">
    <link rel="shortcut icon" href="{{ 'resources/layout/icon.ico' | relative_url }}">
    <script src="{{ 'js/main.js' | relative_url }}"></script>
</head>
<body onload="startUp();">
    <script>
        const BASE_URL = '{{ site.baseurl }}';
    </script>

    <div class="top-buttons">
        <div title="Join the Discord!">
            <a class="discordbtn" rel="noopener noreferrer" href="https://discord.gg/9nKGRKba36" target="_blank">
                <img src="{{ 'resources/layout/discord.png' | relative_url }}" alt="discord-btn">
            </a>
        </div>

        <div class="ghbutton">
            <iframe src="https://ghbtns.com/github-btn.html?user=The007who&repo=behero-decomp&type=star&count=true&size=large" 
            frameborder="0" scrolling="0" width="170" height="30" title="GitHub">
            </iframe>
        </div>
    </div>

    <img src="{{ 'resources/layout/header.jpg' | relative_url }}" alt="header" draggable="false">
    <img src="{{ 'resources/layout/logo.png' | relative_url }}" alt="header-alt" draggable="false">

    <div class="langSwitch">
        <button onclick="buttonLang('ita');"><img src="{{ 'resources/layout/nav/ita.png' | relative_url }}" alt="itabtn"></button>
        <button onclick="buttonLang('eng');"><img src="{{ 'resources/layout/nav/eng.png' | relative_url }}" alt="engbtn"></button>
    </div>

    <nav>

        <div><a href="{{ '/' | relative_url }}"><img src="
            {%- if page.url == '/' -%}
                {{ 'resources/layout/nav/home_s.png' | relative_url }}
            {%- else -%}
                {{ 'resources/layout/nav/home.png' | relative_url }}
            {%- endif -%}
        " alt="homebtn"></a></div>
        
        <div><a href="{{ '/game' | relative_url }}"><img src="
            {%- if page.url contains '/game/' -%}
                {{ 'resources/layout/nav/game_s.png' | relative_url }}
            {%- else -%}
                {{ 'resources/layout/nav/game.png' | relative_url }}
            {%- endif -%}
        " alt="gamebtn"></a></div>

        <div><a href="{{ '/world' | relative_url }}"><img src="
            {%- if page.url contains '/world/' -%}
                {{ 'resources/layout/nav/world_s.png' | relative_url }}
            {%- else -%}
                {{ 'resources/layout/nav/world.png' | relative_url }}
            {%- endif -%}
        " alt="worldbtn"></a></div>

        <div><a href="{{ '/cards' | relative_url }}"><img src="
            {%- if page.url contains '/cards/' or page.url contains '/collection/' -%}
                {{ 'resources/layout/nav/cards_s.png' | relative_url }}
            {%- else -%}
                {{ 'resources/layout/nav/cards.png' | relative_url }}
            {%- endif -%}
        " alt="cardsbtn"></a></div>

        <div><a href="{{ '/media' | relative_url }}"><img src="
            {%- if page.url contains '/media/' -%}
                {{ 'resources/layout/nav/media_s.png' | relative_url }}
            {%- else -%}
                {{ 'resources/layout/nav/media.png' | relative_url }}
            {%- endif -%}
        " alt="mediabtn"></a></div>

        <div><a href="{{ '/hardware' | relative_url }}"><img src="
            {%- if page.url contains '/hardware/' -%}
                {{ 'resources/layout/nav/hardware_s.png' | relative_url }}
            {%- else -%}
                {{ 'resources/layout/nav/hardware.png' | relative_url }}
            {%- endif -%}
        " alt="hardwarebtn"></a></div>

    </nav>

    <div class="content">
        {{ content }}
    </div>

    <footer>
        <section>
            <img src="{{ 'resources/layout/box_news.jpg' | relative_url }}" alt="news_box" draggable="false">
            <div id="commit-history"></div>
        </section>

        <section>
            <a href="{{ '/hardware' | relative_url }}">
                <img src="{{ 'resources/layout/box_console.jpg' | relative_url }}" alt="box_console" draggable="false">
            </a>
        </section>

        <section>
            <a href="{{ '/game' | relative_url }}">
                <img src="{{ 'resources/layout/home_sub_11.jpg' | relative_url }}" alt="box_console" draggable="false">
            </a>
        </section>
    </footer>

    <div id="thanks">
        <p>Big thanks to the contributors:</p>
        <p>
            {%- for contributor in site.data.contributors -%}
                {%- assign color = forloop.index0 | times: 350 | divided_by: forloop.length -%}
                <span style="color: hsl({{ color }}, 100%, 50%)">{{ contributor }}</span>
            {%- endfor -%}
         </p>
    </div>
    
</body>
</html>
